services:
  ros2:
    build:
      context: ./docker
      dockerfile: Dockerfile.ros2-humble
    container_name: ros-mcp-test-ros2
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9090"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s
